<h2>概要</h2>

<p>
PRRS（Porcine Reproductive and Respiratory Syndrome）は、
PRRSウイルスによって起こる豚の重要感染症である。
</p>

<h2>原因</h2>

<ul>
<li>PRRSウイルス（RNAウイルス）</li>
<li>アルテリウイルス科</li>
</ul>

<h2>症状</h2>

<ul>
<li>流産</li>
<li>死産</li>
<li>虚弱子豚</li>
<li>呼吸器症状</li>
<li>発育不良</li>
</ul>

<h2>国家試験ポイント</h2>

<ul>
<li>RNAウイルス</li>
<li>マクロファージで増殖する</li>
<li>繁殖障害＋呼吸器症状</li>
</ul>
